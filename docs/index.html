<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Score Bourse</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#14181f;--mut:#6b7380;--bd:#e3e6ea;--ac:#2f5bea;--c0:#0b7a45;--c1:#2fa866;--c2:#d99a0b;--c3:#e0742a;--c4:#d6453d}
@media(prefers-color-scheme:dark){:root{--bg:#0f1318;--card:#181e26;--tx:#eceff3;--mut:#93a0b0;--bd:#2a323d;--ac:#7c9bff;--c0:#1fa862;--c1:#4cc17f;--c2:#f0b030;--c3:#f08a45;--c4:#f06a62}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,sans-serif;padding:12px;max-width:680px;margin:auto}
.mut{color:var(--mut);font-size:12.5px}.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin:8px 0}
.row{display:flex;align-items:center;gap:10px}.grow{flex:1;min-width:0}.w{flex-wrap:wrap}
.score{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;flex:none}
.tag{font-size:12px;font-weight:600;padding:2px 8px;border-radius:20px;color:#fff}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.btn{padding:8px 11px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font:inherit}.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.star{background:none;border:0;font-size:20px;color:var(--c2)}.al{border-left:4px solid var(--c2);padding:7px 10px;margin:5px 0;background:var(--card);border-radius:8px;font-size:13.5px}
.fl{background:#e0742a22;border:1px solid var(--c3);border-radius:8px;padding:5px 8px;margin:4px 0;font-size:13px}
input,select{padding:7px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);font:inherit;max-width:100%}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:6px;border-bottom:1px solid var(--bd);text-align:left}
</style></head><body>
<h2 style="margin:4px 0">📈 Score Bourse</h2>
<div id="mk" class="mut">Chargement…</div>
<div class="row w" style="margin:8px 0" id="tabs"></div>
<div id="al"></div><div id="v"></div>
<script>
const N=["Achat fort","Acheter","Surveiller","Alléger","Éviter"],TB=[["list","Actions"],["watch","Suivi"],["cmp","Comparer"],["pf","Portefeuille"],["log","Journal"],["how","Méthode"]];
let S=[],M={},LOG=[],W=[],PF=[],BT=null,P={cap:10000,risk:1},tab="list",sel=null,cmp=[],F={sec:"",q:"",sort:"score",pea:false};
try{W=JSON.parse(localStorage.getItem("w")||"[]");P=JSON.parse(localStorage.getItem("p")||JSON.stringify(P));PF=JSON.parse(localStorage.getItem("pf")||"[]")}catch(e){}
const sv=()=>{try{localStorage.setItem("w",JSON.stringify(W));localStorage.setItem("p",JSON.stringify(P));localStorage.setItem("pf",JSON.stringify(PF))}catch(e){}};
const col=s=>s.cat==null?"var(--mut)":`var(--c${s.cat})`,f=(x,u="")=>x==null?"n/d":x+u;
const tag=s=>`<span class="tag" style="background:${col(s)}">${s.verdict}</span>`;
function chart(h){const mn=Math.min(...h),mx=Math.max(...h),k=300/(h.length-1);return`<svg viewBox="0 0 300 90" width="100%"><polyline fill="none" stroke="var(--ac)" stroke-width="2" points="${h.map((y,i)=>i*k+","+(85-(y-mn)/(mx-mn||1)*80)).join(" ")}"/></svg>`}
function card(s){return`<div class="card row" data-o="${s.id}"><div class="score" style="background:${col(s)}">${s.score}</div><div class="grow"><b>${s.n}</b> <span class="mut">${f(s.p," €")} · ${s.sector}</span><br>${tag(s)}${s.flags.length?" ⚠️":""}</div><button class="star" data-w="${s.id}">${W.includes(s.id)?"★":"☆"}</button></div>`}
function detail(s){const q=Math.floor(P.cap*P.risk/100/Math.max(s.p-s.stop,.01));
return`<button class="btn" data-b="1">← Retour</button><div class="card row"><div class="score" style="background:${col(s)};width:64px;height:64px;font-size:22px">${s.score}</div><div><b style="font-size:18px">${s.n}</b><br>${tag(s)} <span class="mut">${s.sector}</span></div></div>
${s.flags.map(x=>`<div class="fl">⚠️ ${x}</div>`).join("")}
<div class="card">${chart(s.h)}<div class="mut">90 derniers jours · dernier cours du ${s.last}</div></div>
<div class="card">${Object.entries(s.crit).map(([k,x])=>`<div style="margin:6px 0"><div class="row"><span class="grow">${k}</span><b>${x}%</b></div><div class="bar"><i style="width:${x}%"></i></div></div>`).join("")}</div>
<div class="card"><b>Pourquoi ce score ?</b><ul style="margin:6px 0;padding-left:18px">${s.why.map(x=>`<li>${x}</li>`).join("")||"<li>Aucun point particulier.</li>"}</ul></div>
<div class="card"><b>Gestion du risque</b><div class="mut">Stop suggéré (2 × ATR) : <b>${s.stop} €</b> · Objectif : <b>${s.target} €</b></div>
<div class="row w" style="margin:8px 0"><label class="mut">Capital €<br><input id="cap" type="number" value="${P.cap}" style="width:110px"></label><label class="mut">Risque %<br><input id="rk" type="number" step="0.1" value="${P.risk}" style="width:70px"></label></div>
<div>Taille de position : <b>${q} actions</b> (${Math.round(q*s.p)} €), pour risquer ${Math.round(P.cap*P.risk/100)} € au maximum.</div></div>
<div class="card mut">Cours ${s.p} € · MM50 ${s.m50} · MM200 ${s.m200} · RSI ${s.rsi} · MACD ${s.macd?"haussier":"baissier"}<br>PER ${f(s.per&&Math.round(s.per*10)/10)} (secteur ${f(s.med)}) · Croissance bénéfices ${f(s.g,"%")} · ROE ${f(s.roe,"%")} · Marge ${f(s.pm,"%")}<br>Dette/EBITDA ${f(s.d)} · Dividende ${f(s.y,"%")} · Analystes ${f(s.s)} · Bêta ${f(s.b)} · Volatilité ${s.vol}% · Baisse max 1 an ${s.mdd}%<br>Prochains résultats : ${f(s.earn)}<br>Pays : ${f(s.country)} · ${s.pea?"PEA probable (à vérifier auprès de ton courtier)":"PEA improbable"}</div>`}
function pfView(){const rows=PF.map((x,i)=>{const s=S.find(y=>y.id==x.id);return s?{...x,i,s,val:s.p*x.qty,pl:(s.p/x.buy-1)*100}:null}).filter(Boolean),tot=rows.reduce((a,r)=>a+r.val,0),sec={},w=[];
rows.forEach(r=>sec[r.s.sector]=(sec[r.s.sector]||0)+r.val);Object.entries(sec).forEach(([k,v])=>{if(tot&&v/tot>.4)w.push(`Concentration : ${k} = ${Math.round(v/tot*100)} % du portefeuille`)});rows.forEach(r=>{if(tot&&r.val/tot>.25)w.push(`${r.s.n} pèse ${Math.round(r.val/tot*100)} % du portefeuille`)});
return`<div class="card"><b>Ajouter une position</b><div class="row w" style="margin-top:6px"><select id="pi">${S.map(s=>`<option value="${s.id}">${s.n}</option>`).join("")}</select><input id="pq" type="number" placeholder="Quantité" style="width:90px"><input id="pb" type="number" step="any" placeholder="Prix d’achat" style="width:110px"><button class="btn on" data-add="1">Ajouter</button></div></div>`+w.map(x=>`<div class="fl">⚠️ ${x}</div>`).join("")+(rows.length?`<div class="card" style="overflow-x:auto"><table><tr><th>Action</th><th>Qté</th><th>Valeur</th><th>+/-</th><th>Verdict</th><th></th></tr>${rows.map(r=>`<tr><td>${r.s.n}</td><td>${r.qty}</td><td>${Math.round(r.val)} €</td><td style="color:var(--c${r.pl>=0?1:4})">${r.pl.toFixed(1)}%</td><td>${tag(r.s)}</td><td><button class="btn" data-del="${r.i}">✕</button></td></tr>`).join("")}</table><div style="margin-top:6px"><b>Total : ${Math.round(tot)} €</b></div></div>`:'<div class="card mut">Aucune position. Les données restent sur cet appareil.</div>')}
function render(){
document.getElementById("tabs").innerHTML=TB.map(([k,l])=>`<button class="btn ${tab==k&&!sel?"on":""}" data-t="${k}">${l}</button>`).join("");
document.getElementById("al").innerHTML=S.filter(s=>W.includes(s.id)&&[0,1,3,4].includes(s.cat)).map(s=>`<div class="al" style="border-color:${col(s)}"><b>${s.n}</b> : ${s.verdict} (${s.score}/100)</div>`).join("");
const v=document.getElementById("v");if(!S.length){v.innerHTML="";return}
if(sel){v.innerHTML=detail(S.find(x=>x.id==sel));return}
if(tab=="list"){const secs=[...new Set(S.map(s=>s.sector))].sort();let a=S.filter(s=>(!F.sec||s.sector==F.sec)&&(!F.pea||s.pea)&&(!F.q||s.n.toLowerCase().includes(F.q.toLowerCase())));a.sort((x,y)=>F.sort=="nom"?x.n.localeCompare(y.n):y.score-x.score);
v.innerHTML=`<div class="row w"><select id="fs"><option value="">Tous secteurs</option>${secs.map(x=>`<option ${F.sec==x?"selected":""}>${x}</option>`).join("")}</select><select id="fo"><option value="score">Tri : score</option><option value="nom" ${F.sort=="nom"?"selected":""}>Tri : nom</option></select><input id="fq" placeholder="Rechercher" value="${F.q}" style="width:130px"><label class="mut"><input type="checkbox" id="fp" ${F.pea?"checked":""}> PEA probable</label></div>`+a.map(card).join("")}
else if(tab=="watch")v.innerHTML=W.length?S.filter(s=>W.includes(s.id)).map(card).join(""):'<div class="card mut">Touche ☆ sur une action pour la suivre : ses alertes s’affichent en haut.</div>';
else if(tab=="cmp")v.innerHTML=`<div class="row w">${S.map(s=>`<button class="btn ${cmp.includes(s.id)?"on":""}" data-c="${s.id}">${s.id.split(".")[0]}</button>`).join("")}</div><div class="mut">Choisis jusqu’à 3 actions.</div>`+(cmp.length?`<div class="card" style="overflow-x:auto"><table><tr><th></th>${cmp.map(i=>`<th>${i.split(".")[0]}</th>`).join("")}</tr>`+[["Score",s=>`<b>${s.score}</b>`],["Verdict",s=>s.verdict],["Secteur",s=>s.sector],["PER",s=>f(s.per&&Math.round(s.per*10)/10)],["Risque",s=>s.crit["Risque"]+"%"],...Object.keys(S[0].crit).map(k=>[k,s=>s.crit[k]+"%"])].map(([l,g])=>`<tr><td>${l}</td>${cmp.map(i=>`<td>${g(S.find(x=>x.id==i))}</td>`).join("")}</tr>`).join("")+"</table></div>":"");
else if(tab=="pf")v.innerHTML=pfView();else if(tab=="log")v.innerHTML=LOG.length?[...LOG].reverse().map(l=>`<div class="card"><b>${l.n}</b> <span class="mut">${l.t}</span><br>${l.de} → ${l.a} (${l.score}/100)</div>`).join(""):'<div class="card mut">Aucun changement de verdict enregistré pour l’instant.</div>';
else v.innerHTML=`<div class="card"><b>Méthode</b><p>Score /100 pour un profil prudent :<br>• Tendance 20 : moyennes 50/200 j, RSI, MACD<br>• Fondamentaux 25 : PER comparé au secteur, croissance (plafonnée), ROE, marge<br>• Solidité 20 : dette/EBITDA, dividende<br>• Analystes 10 : consensus<br>• Risque 25 : bêta calculé vs CAC 40, volatilité, baisse maximale</p><p>${N.map((n,i)=>`<span class="tag" style="background:var(--c${i})">${n}</span> ${[">= 80","65-79","50-64","35-49","< 35"][i]}`).join("<br>")}</p><p>Garde-fous : plafond à 79 si dette ou bêta élevés ; plafond à Surveiller avant des résultats ; -5 points si le CAC 40 est sous sa moyenne 200 jours ; verdict suspendu si trop de données manquent ; valeurs aberrantes signalées par ⚠️.</p>${BT?`<p><b>Test historique (≈3 ans, composante technique seule)</b><br>Quand le score de tendance était élevé, le rendement moyen à ${BT.h} jours était de ${BT.avg_sig} % (${BT.hit_sig} % de hausses, ${BT.n} signaux), contre ${BT.avg_all} % (${BT.hit_all} %) en moyenne sur tous les jours. Limites : seules les actions actuelles du CAC 40 sont testées, les fondamentaux d’époque ne sont pas disponibles, et le passé ne garantit rien.</p>`:""}<p class="mut">Données Yahoo  Finance, différées d’environ 15 min, parfois erronées. Outil d’analyse, pas un conseil en investissement. Aucune garantie de performance.</p></div>`}
document.addEventListener("click",e=>{const t=e.target;
if(t.dataset.t){tab=t.dataset.t;sel=null}else if(t.dataset.w){const i=t.dataset.w;W=W.includes(i)?W.filter(x=>x!=i):[...W,i];sv()}
else if(t.dataset.add){const q=+document.getElementById("pq").value,b=+document.getElementById("pb").value;if(q>0&&b>0){PF.push({id:document.getElementById("pi").value,qty:q,buy:b});sv()}}else if(t.dataset.del){PF.splice(+t.dataset.del,1);sv()}else if(t.dataset.b)sel=null;else if(t.dataset.c){const i=t.dataset.c;cmp=cmp.includes(i)?cmp.filter(x=>x!=i):[...cmp,i].slice(-3)}
else if(t.closest("[data-o]"))sel=t.closest("[data-o]").dataset.o;else return;render()});
document.addEventListener("change",e=>{const t=e.target;
if(t.id=="fs")F.sec=t.value;else if(t.id=="fp")F.pea=t.checked;else if(t.id=="fo")F.sort=t.value;else if(t.id=="fq")F.q=t.value;
else if(t.id=="cap"||t.id=="rk"){P.cap=+document.getElementById("cap").value||10000;P.risk=+document.getElementById("rk").value||1;sv()}else return;render()});
fetch("data.json?"+Date.now()).then(r=>r.json()).then(d=>{S=d.stocks;M=d.market||{};BT=d.backtest;
const age=d.updated?Math.round((Date.now()-new Date(d.updated))/60000):null,old=M.open&&age>30;
document.getElementById("mk").innerHTML=d.updated?`${M.open?"🟢 Marché ouvert":"⚪ Marché fermé"} · CAC 40 ${f(M.cac)} ${M.cac_ok?"(au-dessus":"(sous"} sa moyenne 200 j) · ${old?"🔴":"✅"} données du ${new Date(d.updated).toLocaleString("fr-FR")}<br>Profil prudent · pas un conseil en investissement · cours différés d’environ 15 min`:"Aucune donnée : lance « Run workflow » dans GitHub > Actions.";
render()}).catch(()=>document.getElementById("mk").textContent="Erreur de chargement");
fetch("history.json?"+Date.now()).then(r=>r.json()).then(h=>{LOG=h;if(tab=="log")render()}).catch(()=>{});
</script></body></html>
